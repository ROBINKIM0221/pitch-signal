# 화면 3 '고교 투구수 현황판'의 실제 입력 두 벌. 평가 설정(config.yaml·config_calibrated.yaml)과 분리해 두어 고정한 설정 파일의 해시가 바뀌지 않게 한다.
# 자료: KBSA 기록실 경기 기록(korea-baseball.com/game/record_detail, 팀별 투수기록 표). 2026-10-07 1회 수집(저장소 밖 스크립트), 원본은 data/raw/kbsa/ (저장소에 올리지 않음).
source: KBSA 기록실 경기 기록(korea-baseball.com/game/record_detail), 2026-10-07 1회 수집
games_csv: data/raw/kbsa/games_2025.csv            # 2025 고교(18세 이하부) 37개 리그 976경기 목록: 리그·날짜·두 팀·점수
name_map: C:/work/private/pitchsignal/kbsa_2025_names.csv   # 선수 실명 ↔ 등번호 표기 대응표 (저장소 밖에만 둔다)
labels: 학교는 실명, 선수는 등번호(#nn)로만 표시한다 (2026-10-07 결정. 선수 실명은 저장소·화면 어디에도 넣지 않는다)
seed: 2025
load_lights:                                      # 고교 '누적 부하' 신호등 (2026-10-07 결정: ACWR 대신 절대량). 규정이 아니라 전국 2025 자료 분위수에 근거한 서술적 눈금
  sum7: {caution: 120, high: 150}                 # 오늘 포함 7일 투구 수 합 — 등판일 기준 상위 5% / 2% (전국 1,024명)
  pair3: {caution: 70, high: 100}                 # 3일 안 두 등판의 합 (규정이 허용하는 '45구 이하 뒤 휴식 0일' 구멍) — 경험 투수 20% / 10%

scoresheets:                                      # 기록지 사진 판독 (2026-10-07 결정: 시범 30경기 → 통과하면 2025 전체)
  dir: C:/work/private/pitchsignal/scoresheets    # 기록지 사진 <game_idx>_<boxfile_seq>.jpg (선수 실명이 있어 저장소 밖에만 둔다)
  pilot_games: 30                                 # 시범: 리그마다 한 경기, 기록지 두 장, 두 팀 모두 판정 기준 이상 등판의 흐름이 복원된 경기
  dev_games: [36651]                              # 개발용으로 먼저 받은 경기 (시범 표본에서 뺀다)
  judge_min_pitches: 40                           # '평소보다 볼이 많았던 등판' 판정은 이 투구 수 이상 등판만 (2026-10-07 사용자 결정)
  gate_tol: 0.15                                  # 읽은 표시 수가 공식 투구 수와 이만큼 넘게 다르면 볼 비율을 보여 주지 않는다 (2026-10-08 결정 B, 시범 40구+ 84% 통과)
  flag_z: 2.0                                     # (볼 비율 − 평소) ÷ √(평소(1−평소)/읽은 표시 수) 가 이 값 이상이면 '평소보다 볼이 많았던 등판'
  flag_min_history: 3                             # 평소를 잡으려면 같은 투수의 다른 검산 통과 등판이 이만큼 있어야 한다
  train_set: C:/work/private/pitchsignal/scoresheet_pilot/train_marks.parquet   # 시범 학습 자료(공식 타석 결과 + 모양 군집 정답, 저장소 밖)

datasets:
  korea_2025:                                     # 시즌 모드: 2025 고교 공식 경기 전부 (전국) → KBSA 규정 + ACWR (3.14절 원안). 화면에서 권역·학교를 고른다
    mode: season
    name: 2025 시즌 전국 고교 공식 경기
    short: 2025 시즌
    season: 2025
    region_leagues:                               # 권역 = 주말리그 참가 리그 (전·후반기). 어느 리그에도 없는 팀은 '기타'
      서울: [1256, 1257, 1258, 1295, 1296, 1297]
      서울·인천: [1259, 1298]
      경기: [1267, 1268, 1269, 1305, 1306, 1307]
      강원: [1266, 1291]
      충청: [1264, 1302]
      대전·전북: [1265, 1304]
      광주·전남: [1270, 1303]
      경상: [1260, 1261, 1262, 1299, 1290, 1300]
      부산: [1263, 1301]
    competitions:                                 # 리그 이름에 이 글자가 들어가면 그 대회 (hs 모듈의 competition 열)
      주말리그 전반기: 주말리그 전반기
      주말리그 후반기: 주말리그 후반기
      이마트배 전국고교야구대회: 신세계 이마트배
      황금사자기: 황금사자기
      청룡기: 청룡기
      대통령배: 대통령배
      봉황대기: 봉황대기
      전국체육대회: 전국체전
      노브랜드배: 기타
    overrides:                                    # config.yaml highschool 블록 위에 덮어쓰는 값 (schools 수는 실행 때 팀 수로 채움)
      season: 2025
      competitions: [주말리그 전반기, 주말리그 후반기, 신세계 이마트배, 황금사자기, 청룡기, 대통령배, 봉황대기, 전국체전, 기타]
      input_ranges: {game_no: [1, 9999], pitches: [1, 200], outs: [0, 60], team_outs_per_game: [0, 60]}

  tournament_2025:                                # 대회 모드: 7일 단판 토너먼트 → ACWR 대신 대회 누적 투구 수·휴식 간격
    mode: tournament
    name: 제106회 전국체육대회 18세 이하부
    short: 2025 전국체전
    season: 2025
    dates: 2025-10-17 ~ 2025-10-23                # 부산(기장 현대차드림볼파크), 15팀 14경기
    lig_idx: 1356
    games: [36651, 36652, 36653, 36654, 36655, 36656, 36657, 36692, 36693, 36696, 36698, 36700, 36702, 36712]
    rounds: {16강: 7, 8강: 4, 준결승: 2, 결승: 1}  # 경기 순서(날짜·번호)대로 배정
    overrides:
      season: 2025
      competitions: [전국체전]
      input_ranges: {game_no: [1, 999], pitches: [1, 200], outs: [0, 60], team_outs_per_game: [0, 60]}   # 13회 경기·상세 기록 없는 경기 허용
